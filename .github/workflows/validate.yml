name: Validate case data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Ensure generated browser data is committed
        run: git diff --exit-code -- data/cases.js data/cases.en.js index.en.html
